<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f2" />
    <title>Markora</title>
    <style>
      /* ---------- startup splash ---------- */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f7f5f2;
        transition: opacity 0.32s cubic-bezier(0.4, 0, 0.2, 1), transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: opacity, transform;
      }
      #splash.splash-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .splash-mark {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: linear-gradient(135deg, #d9a08a 0%, #b65b3e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 26px rgba(182, 91, 62, 0.28);
        animation: mark-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .splash-mark svg {
        width: 30px;
        height: 30px;
        stroke: #fff;
        stroke-width: 2.1;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 120;
        stroke-dashoffset: 120;
        animation: draw 0.9s 0.18s ease forwards;
      }
      .splash-name {
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8a7f74;
        font-weight: 600;
        animation: rise 0.6s 0.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .splash-bar {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        background: rgba(138, 127, 116, 0.18);
        overflow: hidden;
        position: relative;
        animation: rise 0.6s 0.16s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #b65b3e, transparent);
        transform: translateX(-100%);
        animation: sweep 1.1s 0.3s ease-in-out infinite;
      }
      @keyframes mark-in {
        from { opacity: 0; transform: scale(0.7) rotate(-8deg); }
        to { opacity: 1; transform: scale(1) rotate(0); }
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes sweep {
        100% { transform: translateX(100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; transition: none !important; }
      }
      /* ---------- first paint transition ---------- */
      #root {
        opacity: 0;
        animation: app-in 0.45s 0.15s ease forwards;
      }
      @keyframes app-in {
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 19V5.5A1.5 1.5 0 0 1 5.5 4H14l6 6v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19Z" />
          <path d="M14 4v5.5A.5.5 0 0 0 14.5 10H20" />
          <path d="M8 13h7M8 16.5h5" />
        </svg>
      </div>
      <div class="splash-name">Markora</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
